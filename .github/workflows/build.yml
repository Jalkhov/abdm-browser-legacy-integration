name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install xmllint (best effort)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils || true

      - name: Check JavaScript syntax
        run: |
          for f in src/content/*.js; do
            node --check "$f"
          done

      - name: Check locales
        run: python3 tools/check_locales.py

      - name: Build XPI
        run: ./build.sh

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: abdm-legacy-xpi
          path: "*.xpi"
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.xpi"
          generate_release_notes: true
